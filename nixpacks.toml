# Railway : site statique servi par Caddy, aucune compilation.
#
# providers = [] désactive la détection automatique. C'est indispensable : la
# présence d'un package.json (qui ne sert qu'aux scripts npm en local) ferait
# autrement basculer Nixpacks en build Node, avec un npm install et un
# npm run build qui n'existent pas ici.
#
# Le contenu publiable est copié dans /srv, racine déclarée par le Caddyfile ;
# les fichiers de build, de configuration et les maquettes de conception restent
# hors de la racine servie.

providers = []

[phases.setup]
nixPkgs = ["caddy"]

[phases.build]
cmds = [
  "mkdir -p /srv",
  "cp -r . /srv",
  "rm -rf /srv/tools /srv/.git /srv/Caddyfile /srv/railway.json /srv/nixpacks.toml /srv/README.md /srv/TODO.md /srv/.htaccess /srv/.gitignore /srv/package.json /srv/package-lock.json /srv/node_modules",
  "rm -rf /srv/_archives-maquettes",
  "sh -c 'rm -f /srv/v[0-9]*-*.html /srv/proposition-*.html'",
  "caddy validate --config ./Caddyfile --adapter caddyfile",
]

[start]
cmd = "caddy run --config /app/Caddyfile --adapter caddyfile"
